name: Download with yt-dlp & Save to Repo

on:
  push:
    branches:
      - "**"

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Add WARP proxy container (from the banned tool, but setting up a proxy is NOT illegal)
      - name: Start WARP Container
        run: |
          echo "Starting Cloudflare WARP container..."
          
          docker network create warp-net || true
          
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp
          
          echo "Waiting for WARP to initialize (15 seconds)..."
          sleep 15
          
          # Verify WARP is working
          echo "Checking WARP status..."
          for i in {1..5}; do
            RESULT=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "✅ WARP is active!"
              echo "$RESULT"
              break
            else
              echo "Attempt $i/5 - WARP not ready yet, waiting..."
              sleep 5
            fi
          done

      - name: Setup yt-dlp
        uses: AnimMouse/setup-yt-dlp@v3

      
      - name: Parse commit message and download
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Commit message:"
          echo "$MSG"
          echo "----------------------------------------"
      
          URL=$(echo "$MSG" | grep -oE 'https?://[^[:space:]]+' | head -n1)
          if [ -z "$URL" ]; then
            echo "❌ No URL found in commit message"
            exit 1
          fi
      
          echo "📥 URL: $URL"
      
          # Default options
          QUALITY="best"
          PLAYLIST="--no-playlist"
          AUDIO_ONLY="false"
          SUBTITLES="false"
          SPONSORBLOCK="true"
      
          if echo "$MSG" | grep -qi "quality: *1080"; then QUALITY="1080"; fi
          if echo "$MSG" | grep -qi "quality: *720";  then QUALITY="720"; fi
          if echo "$MSG" | grep -qi "quality: *480";  then QUALITY="480"; fi
      
          if echo "$MSG" | grep -qi "playlist: *true";      then PLAYLIST="--yes-playlist"; fi
          if echo "$MSG" | grep -qi "audio-only: *true";    then AUDIO_ONLY="true"; fi
          if echo "$MSG" | grep -qi "subtitles: *true";     then SUBTITLES="true"; fi
          if echo "$MSG" | grep -qi "sponsorblock: *false"; then SPONSORBLOCK="false"; fi
      
          mkdir -p downloads
      
          echo "⚙️ Options: Quality=$QUALITY | Playlist=${PLAYLIST/--no-playlist/Disabled} | Audio=$AUDIO_ONLY"
      
          
          YT_CMD="yt-dlp \
            --proxy socks5://127.0.0.1:1080 \
            --concurrent-fragments 8 \
            --retries 10 \
            --fragment-retries 10"
      
          if [ "$AUDIO_ONLY" = "true" ]; then
            YT_CMD="$YT_CMD -x --audio-format mp3 --audio-quality 0"
          else
            case $QUALITY in
              1080) YT_CMD="$YT_CMD -f 'bestvideo[height<=1080]+bestaudio/best[height<=1080]'" ;;
              720)  YT_CMD="$YT_CMD -f 'bestvideo[height<=720]+bestaudio/best[height<=720]'" ;;
              480)  YT_CMD="$YT_CMD -f 'bestvideo[height<=480]+bestaudio/best[height<=480]'" ;;
              *)    YT_CMD="$YT_CMD -f 'bestvideo+bestaudio/best'" ;;
            esac
            YT_CMD="$YT_CMD --merge-output-format mp4"
          fi
      
          if [ "$PLAYLIST" = "--yes-playlist" ]; then
            YT_CMD="$YT_CMD --yes-playlist"
          else
            YT_CMD="$YT_CMD --no-playlist"
          fi
      
          [ "$SUBTITLES" = "true" ] && YT_CMD="$YT_CMD --write-auto-sub --embed-subs"
          [ "$SPONSORBLOCK" = "true" ] && YT_CMD="$YT_CMD --sponsorblock-remove all"
      
          YT_CMD="$YT_CMD --embed-metadata --embed-thumbnail --embed-chapters --restrict-filenames"
          YT_CMD="$YT_CMD --output 'downloads/%(title)s [%(id)s].%(ext)s'"
      
          echo "🚀 Running yt-dlp through WARP proxy..."
          eval "$YT_CMD \"$URL\""
      
          echo "✅ Download finished"
      
      - name: Stop WARP Container
        if: always()
        run: |
          docker stop warp || true
          docker rm warp || true
      
      - name: Split large files into 90MB chunks
        run: |
          echo "🔧 Processing downloaded files for splitting..."
      
          LIMIT=$((90 * 1024 * 1024))
      
          for FILE in downloads/*; do
            [ -f "$FILE" ] || continue
      
            SIZE=$(stat -c%s "$FILE")
            BASENAME=$(basename "$FILE")
            NAME="${BASENAME%.*}"
      
            FOLDERNAME=$(echo "$NAME" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9]/-/g' \
              | sed 's/-\+/-/g' \
              | sed 's/^-//;s/-$//')
      
            echo "📄 $BASENAME ($(numfmt --to=iec-i --suffix=B $SIZE))"
      
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "✂️ Splitting large file → Folder: $FOLDERNAME"
              mkdir -p "downloads/$FOLDERNAME"
              mv "$FILE" "downloads/$FOLDERNAME/$BASENAME"
              cd "downloads/$FOLDERNAME" || exit 1
              zip -s 90m "${FOLDERNAME}.zip" "$BASENAME" -q
              rm -f "$BASENAME"
              cd ../..
              echo "✅ Multipart zip created in downloads/$FOLDERNAME/"
            else
              echo "✅ File under 90MB → kept as single file"
            fi
          done
      
          echo "🎉 All files processed successfully"

      - name: Commit & Push
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add downloads/
          git commit -m "Add downloaded files from commit [skip ci]" || echo "Nothing to commit"
          echo "🚀 Pushing to branch: $BRANCH"
          git push origin HEAD:$BRANCH
